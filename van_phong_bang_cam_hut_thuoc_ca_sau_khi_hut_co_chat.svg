<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <clipPath id="inside"><circle cx="620" cy="600" r="274"/></clipPath>
  </defs>

  <rect width="1240" height="1754" fill="#ffffff"/>
  <rect x="30" y="30" width="1180" height="1694" rx="40" fill="#ffffff" stroke="#d71920" stroke-width="16"/>

  <!-- Tiêu đề -->
  <text x="620" y="90" text-anchor="middle" font-size="28" font-weight="600" fill="#555555">Đây là sản phẩm từ AI, vui lòng không làm theo</text>
  <text x="620" y="222" text-anchor="middle" font-size="110" font-weight="900" fill="#d71920">CẤM HÚT THUỐC</text>

  <!-- Biểu tượng: người ám mùi thuốc + vòng cấm -->
  <g transform="translate(620,482.5) scale(0.72) translate(-620,-600)">
  <circle cx="620" cy="600" r="274" fill="#ffffff"/>
  <g clip-path="url(#inside)">
    <rect x="590" y="540" width="60" height="70" fill="#222222"/>
    <path d="M 400 900 L 400 760 C 400 640 520 590 620 590 C 720 590 840 640 840 760 L 840 900 Z" fill="#222222"/>
    <circle cx="620" cy="480" r="78" fill="#222222"/>
    <g fill="none" stroke="#8c8c8c" stroke-width="14" stroke-linecap="round">
      <path d="M 470 590 c -30 -35 30 -65 0 -100 c -30 -35 30 -65 0 -100"/>
      <path d="M 770 590 c 30 -35 -30 -65 0 -100 c 30 -35 -30 -65 0 -100"/>
      <path d="M 545 400 c -22 -26 22 -48 0 -74"/>
      <path d="M 695 400 c 22 -26 -22 -48 0 -74"/>
    </g>
  </g>
  <circle cx="620" cy="600" r="302" fill="none" stroke="#d71920" stroke-width="56"/>
  <line x1="406.5" y1="386.5" x2="833.5" y2="813.5" stroke="#d71920" stroke-width="56"/>
  </g>

  <g transform="translate(0,-235)">
  <!-- Khẩu hiệu -->
  <rect x="120" y="980" width="1000" height="130" rx="20" fill="#d71920"/>
  <text x="620" y="1072" text-anchor="middle" font-size="76" font-weight="900" fill="#ffffff">KỂ CẢ SAU KHI HÚT</text>
  <text x="620" y="1160" text-anchor="middle" font-size="34" font-weight="600" letter-spacing="3" fill="#666666">NO SMOKING — NOT EVEN AFTERWARDS</text>

  <text x="620" y="1235" text-anchor="middle" font-size="42" fill="#222222">Mùi thuốc lá bám trên người, quần áo và hơi thở</text>
  <text x="620" y="1285" text-anchor="middle" font-size="42" font-weight="700" fill="#222222">cũng được tính là hút thuốc.</text>

  <!-- Hướng dẫn sau khi hút -->
  <rect x="120" y="1330" width="1000" height="328" rx="24" fill="#fff3f3" stroke="#d71920" stroke-width="4"/>
  <text x="620" y="1393" text-anchor="middle" font-size="44" font-weight="800" fill="#d71920">Vừa hút xong? Vui lòng:</text>

  <g text-anchor="middle">
    <circle cx="287" cy="1465" r="32" fill="#d71920"/>
    <text x="287" y="1478" font-size="38" font-weight="800" fill="#ffffff">1</text>
    <text x="287" y="1540" font-size="36" font-weight="700" fill="#222222">Súc miệng /</text>
    <text x="287" y="1582" font-size="36" font-weight="700" fill="#222222">đánh răng</text>

    <circle cx="620" cy="1465" r="32" fill="#d71920"/>
    <text x="620" y="1478" font-size="38" font-weight="800" fill="#ffffff">2</text>
    <text x="620" y="1540" font-size="36" font-weight="700" fill="#222222">Rửa tay</text>

    <circle cx="953" cy="1465" r="32" fill="#d71920"/>
    <text x="953" y="1478" font-size="38" font-weight="800" fill="#ffffff">3</text>
    <text x="953" y="1540" font-size="36" font-weight="700" fill="#222222">Cởi áo khoác</text>
    <text x="953" y="1582" font-size="36" font-weight="700" fill="#222222">ám mùi</text>

    <text x="620" y="1640" font-size="34" fill="#444444">rồi hãy vào phòng làm việc.</text>
  </g>
  </g>

  <!-- Đoạn chat vui -->
  <text x="120" y="1478" font-size="26" font-weight="600" fill="#777777">Mũi của đồng nghiệp</text>
  <path d="M 135 1555 L 116 1578 L 172 1560 Z" fill="#eceff1"/>
  <rect x="120" y="1490" width="760" height="70" rx="35" fill="#eceff1"/>
  <text x="158" y="1535" font-size="32" fill="#222222">Mũi mình nhận ra bạn trước cả mắt mình đó nha!</text>

  <text x="1120" y="1598" text-anchor="end" font-size="26" font-weight="600" fill="#777777">Bạn vừa hút xong</text>
  <path d="M 1105 1675 L 1124 1698 L 1068 1680 Z" fill="#d71920"/>
  <rect x="240" y="1610" width="880" height="70" rx="35" fill="#d71920"/>
  <text x="278" y="1655" font-size="32" fill="#ffffff">Hiểu rồi! 2 phút “tân trang” là quay lại liền, cảm ơn nha!</text>
</svg>
